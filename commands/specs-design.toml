description = "Create or update a module's design.md"
prompt = '''
Create or update the `.specs/{{args}}/design.md` document for the module `{{args}}`. If `{{args}}` is empty, ask the user for the module name first.

Load the specs-workflow skill (skill tool, name `specs-workflow`), then read from the skill directory: `references/file-templates.md` (skeleton), `references/prompt-templates.md` (depth guidance), and `references/examples/traceability.md` (traceability format), and follow them. If the skill is not available, follow the rules below.

Follow these rules:

- **Overview**: module positioning, core design principles, and the key trade-offs made.
- **Architecture**: layers/modules and data flow. Use a Mermaid diagram. Explain *why* the system is split this way, not just how.
- **Components / Composables**: for each core component — interface, responsibility, and core logic in structured pseudocode. Explain the trade-offs and constraints behind each choice, highlight state transitions and core branching logic.
- **Interfaces & Data Models**: types, fields, literal union values, defaults, and which fields are optional and what omission means.
- **Key Decisions**: for each decision with a real trade-off (e.g. controlled vs uncontrolled, headless vs styled) — context, options considered with pros/cons/effort, the chosen option, and the rationale for why it beats the alternatives. Do not pad with obvious choices.
- **Error Handling**: a scenario/handling table covering exceptional inputs, empty/disabled states, async failures, and misuse (e.g. used outside a provider).
- **Correctness Properties**: formal statements in the `*For any* <precondition>, <conclusion>` form, each marked `**Validates: Requirements x.y**`. Every property must be checkable by a test; if it cannot be asserted, it is not a property.

Read the module's `.specs/{{args}}/requirements.md` first so every requirement number referenced by `**Validates:**` actually exists. If `.specs/{{args}}/design.md` already exists, preserve its content and extend it rather than rewriting.
'''
