description = "根据需求描述，统一创建模块的全部 spec 文档"
prompt = '''
根据 `{{args}}` 中描述的功能，一次性创建 `.specs/<module>/` 下的四个文档。若 `{{args}}` 为空，先请用户描述功能。

从描述中推导小写 `kebab-case` 模块名（例如"一个支持注册与 OAuth 的用户认证模块" → `user-auth`）。若无法推导，向用户询问。若描述缺少关键信息——范围边界、边界情况或约束——先补 1–2 个聚焦问题；信息足够则直接生成。

若 `.specs/` 尚不存在，先引导它（index.md + 状态总表），再创建模块。

加载 specs-workflow 技能（skill 工具，名称为 `specs-workflow`），然后从技能目录中阅读：`references/file-templates.md`（骨架）、`references/prompt-templates.md`（深度指引）、`references/checklists.md`（质量清单）、`references/examples/traceability.md`（追溯格式），并遵循它们。若技能不可用，遵循下方规则。

按依赖顺序生成文档：

1. **requirements.md** — `Requirement N`（整数，递增）+ User Story + 验收标准按 `N.M` 编号，使用 `THE <System> SHALL` / `WHEN` / `IF` / `WHILE` 句式（可补充复合 `AND` / `OR` 条件以及基于状态、性能与安全类的变体），每一条都可被机器测试，整体覆盖正常路径、边界条件与错误/排除场景。
2. **design.md** — 先阅读 `requirements.md`：Overview（定位 + 关键取舍）/ Architecture（Mermaid，说明"为什么"这样拆分）/ Components & Composables（接口、职责、结构化伪代码）/ Interfaces & Data Models（类型、字段、默认值、可选项）/ Key Decisions（上下文、备选方案、理由）/ Error Handling（场景/策略表）/ Correctness Properties（`*For any* <前置条件>, <结论>`，每条标注 `**Validates: Requirements x.y**`，不允许悬空引用）。
3. **tasks.md** — 先阅读 `requirements.md`：层级任务按 `N.M` 编号，按选定的排序策略组织（Foundation-First / Feature-Slice / Risk-First / Hybrid），每条引用 `_Requirements: x.y, x.z_`，含检查点任务与 JSON 形式的 Task Dependency Graph（waves）。
4. **CHANGELOG.md** — 创建表头，暂无条目。
5. 在 `.specs/index.md` 状态总表中为该模块添加一行，状态为 `design`（需求与设计就绪，待实现），并追加到 Change Log 表。

不编写任何实现代码。若模块目录已存在，告知用户并扩展既有文档，而不是覆盖。之后要单独更新某个文档，使用 `/specs-requirements`、`/specs-design` 或 `/specs-tasks`。
'''
